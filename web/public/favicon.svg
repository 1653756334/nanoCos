<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- 主 N 字符折叠渐变：霓虹电光青 -> 核心科技蓝 -->
    <linearGradient id="nanoPrimary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="35%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>

    <!-- 右侧立柱渐变：电光蓝 -> 深度曜石靛紫 -->
    <linearGradient id="nanoSecondary" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="100%" stop-color="#7C3AED" />
    </linearGradient>

    <!-- 纳米数据粒子渐变 -->
    <linearGradient id="nanoParticle" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <!-- 柔和微辉光 -->
    <filter id="nanoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- 1. 右侧数据立柱 (底图层，深邃纵深) -->
  <path
    d="M 94 94 L 94 36"
    fill="none"
    stroke="url(#nanoSecondary)"
    stroke-width="18"
    stroke-linecap="round"
  />

  <!-- 2. 主 N 动态折叠流线 (左立柱 + 对角切线，科技动感) -->
  <path
    d="M 34 94 L 34 34 L 94 94"
    fill="none"
    stroke="url(#nanoPrimary)"
    stroke-width="18"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- 3. 对角棱线光感 (质感高光) -->
  <path
    d="M 36 34 L 92 92"
    fill="none"
    stroke="#FFFFFF"
    stroke-width="2.5"
    stroke-linecap="round"
    stroke-opacity="0.35"
  />

  <!-- 4. 纳米粒子点 (Nano Data Byte · 象征对象存储核心) -->
  <circle cx="104" cy="22" r="8" fill="url(#nanoParticle)" filter="url(#nanoGlow)" />
  <circle cx="104" cy="22" r="3.5" fill="#FFFFFF" />
</svg>
