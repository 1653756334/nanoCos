<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- 无限流光主渐变：赛博青 -> 极速天蓝 -> 核心科技蓝 -> 曜石极光紫 -->
    <linearGradient id="infinityGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="35%" stop-color="#38BDF8" />
      <stop offset="70%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>

    <!-- 交叉处立体阴影渐变 (体现莫比乌斯空间穿插层深) -->
    <linearGradient id="crossShadow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1B4B" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#1E1B4B" stop-opacity="0" />
    </linearGradient>

    <!-- 核心微光滤镜 -->
    <filter id="nanoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- 1. 底层穿透光轨 (后环) -->
  <path
    d="M 42 42 C 20 42 20 86 42 86 C 58 86 70 42 86 42 C 108 42 108 86 86 86 C 70 86 58 42 42 42 Z"
    stroke="url(#infinityGrad)"
    stroke-width="15"
    stroke-linecap="round"
    stroke-linejoin="round"
    fill="none"
  />

  <!-- 2. 前景立体跨越遮罩线 (从左下划向右上，形成立体咬合感) -->
  <path
    d="M 50 72 C 58 86 70 42 78 56"
    stroke="url(#infinityGrad)"
    stroke-width="15"
    stroke-linecap="round"
    fill="none"
  />

  <!-- 3. 交叉点景深遮蔽 (极轻微环境阴影) -->
  <circle cx="64" cy="64" r="9" fill="url(#crossShadow)" opacity="0.4" />

  <!-- 4. 纳米级量子数据节点 (象征 CAS 内容寻址与对象原子核心) -->
  <circle cx="64" cy="64" r="5" fill="#00F2FE" filter="url(#nanoGlow)" />
  <circle cx="64" cy="64" r="2.2" fill="#FFFFFF" />
</svg>
