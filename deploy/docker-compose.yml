services:
  nanocos:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        VERSION: v1.1.0
    container_name: nanocos
    restart: unless-stopped
    ports:
      # 宿主机对外映射端口，可通过 deploy/.env 中的 NANOCOS_PORT 自定义，默认 9000
      - "${NANOCOS_PORT:-9000}:9000"
    env_file:
      - path: .env
        required: false
    environment:
      # 容器内部固定监听地址与持久化目录
      NANOCOS_ADDR: ":9000"
      NANOCOS_DATA_DIR: "/app/data"
      # 以下配置均优先从 deploy/.env 读取，若未定义则使用默认安全兜底
      NANOCOS_ADMIN_USER: "${NANOCOS_ADMIN_USER:-admin}"
      NANOCOS_ADMIN_PASS: "${NANOCOS_ADMIN_PASS:-}"
      NANOCOS_SECRET: "${NANOCOS_SECRET:-}"
      NANOCOS_S3_REGION: "${NANOCOS_S3_REGION:-us-east-1}"
      NANOCOS_MAX_UPLOAD_GB: "${NANOCOS_MAX_UPLOAD_GB:-50}"
      NANOCOS_LOG_LEVEL: "${NANOCOS_LOG_LEVEL:-info}"
      NANOCOS_LOG_FORMAT: "${NANOCOS_LOG_FORMAT:-json}"
      NANOCOS_TRUST_PROXY: "${NANOCOS_TRUST_PROXY:-false}"
      NANOCOS_PUBLIC_URL: "${NANOCOS_PUBLIC_URL:-}"
    volumes:
      # 宿主机数据持久化挂载路径，支持在 deploy/.env 中通过 NANOCOS_DATA_VOLUME 绑定独立数据盘
      - "${NANOCOS_DATA_VOLUME:-./data}:/app/data"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9000/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
